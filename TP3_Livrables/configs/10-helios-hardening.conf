# Durcissement SSH Helios Logistique — TP3 BTC2
Port 2242
AddressFamily inet
ListenAddress 192.168.56.10
ListenAddress 10.42.0.10

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30

AllowGroups ssh-admins

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no

LogLevel VERBOSE
PrintLastLog yes
Banner /etc/issue.net
Subsystem sftp internal-sftp -l INFO -f AUTHPRIV

# Exception maîtrisée pour l'équipe d'exploitation
Match Group helios-ops
    AllowTcpForwarding yes
    PermitOpen localhost:10051
